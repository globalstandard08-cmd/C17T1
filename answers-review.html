<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Your Answers — Writing Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(31, 58, 95, 0.10);
            overflow: hidden;
        }
        .header {
            padding: 20px 25px 15px;
            border-bottom: 1px solid #c5d2e3;
        }
        .ielts-logo {
            display: block;
            max-width: 220px;
            height: auto;
        }
        .intro-section {
            padding: 18px 25px;
            background: #f0f7ff;
            border-bottom: 1px solid #cce4ff;
            text-align: center;
        }
        .intro-section h1 {
            color: #1f3a5f;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .intro-section p {
            color: #3b6494;
            font-size: 14px;
        }
        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .answer-block {
            padding: 25px;
            border-bottom: 1px solid #e2e8f0;
        }
        .answer-block:last-child {
            border-bottom: none;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1f3a5f;
        }
        .task-header h2 {
            font-size: 18px;
            color: #1f3a5f;
        }
        .word-badge {
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            background: #e5e7eb;
            color: #4b5563;
        }
        .word-badge.good {
            background: #dcfce7;
            color: #166534;
        }
        .word-badge.warn {
            background: #fef3c7;
            color: #b45309;
        }
        .word-badge.short {
            background: #fee2e2;
            color: #dc2626;
        }
        .answer-text {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 18px;
            min-height: 180px;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.7;
            color: #1f2937;
        }
        .empty-note {
            color: #9ca3af;
            font-style: italic;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-btn {
            background: #f0f4f8;
            border: 1px solid #c5d2e3;
            color: #1f3a5f;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover {
            background: #e2eaf3;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .export-all-btn {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            color: #1e40af;
        }
        .export-all-btn:hover {
            background: #bfdbfe;
        }
        .restart-btn {
            background: #fff0f0;
            border: 1px solid #fecaca;
            color: #dc2626;
        }
        .restart-btn:hover {
            background: #fee2e2;
        }
        @media (max-width: 768px) {
            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="ielts-logo.png" alt="IELTS Logo" class="ielts-logo">
    </div>
    <div class="intro-section">
        <h1>📝 Review Your Writing Answers</h1>
        <p>Check your Task 1 and Task 2 responses below. Click Previous to go back and edit.</p>
    </div>

    <div class="answers-grid">
        <!-- TASK 1 ANSWER -->
        <div class="answer-block">
            <div class="task-header">
                <h2>Task 1 — Summary Response</h2>
                <div class="word-badge" id="t1Badge">Words: 0 / 150 min</div>
            </div>
            <div class="answer-text" id="t1Text">
                <span class="empty-note">— No answer written yet —</span>
            </div>
        </div>

        <!-- TASK 2 ANSWER -->
        <div class="answer-block">
            <div class="task-header">
                <h2>Task 2 — Essay Response</h2>
                <div class="word-badge" id="t2Badge">Words: 0 / 250 min</div>
            </div>
            <div class="answer-text" id="t2Text">
                <span class="empty-note">— No answer written yet —</span>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="writing-test-task2.html" class="nav-btn">⬅️ Back to Task 2</a>
        <div class="action-buttons">
            <button class="nav-btn export-all-btn" onclick="exportAll()">📥 Download All</button>
            <button class="nav-btn restart-btn" onclick="restartTest()">🔄 Clear & Restart</button>
        </div>
    </div>
</div>

<script>
// === Load & Count Words ===
function countWords(text) {
    text = text.trim();
    if (!text) return 0;
    return text.replace(/\s+/g, ' ').split(' ').length;
}

function setBadge(badgeId, wordCount, minWords) {
    const badge = document.getElementById(badgeId);
    badge.textContent = `Words: ${wordCount} / ${minWords} min`;
    badge.classList.remove('good','warn','short');
    if (wordCount >= minWords + 20) badge.classList.add('good');
    else if (wordCount >= minWords) badge.classList.add('warn');
    else badge.classList.add('short');
}

window.onload = function() {
    // Load Task 1
    const t1 = localStorage.getItem('task1Input') || '';
    if (t1) {
        document.getElementById('t1Text').textContent = t1;
        setBadge('t1Badge', countWords(t1), 150);
    }

    // Load Task 2
    const t2 = localStorage.getItem('task2Input') || '';
    if (t2) {
        document.getElementById('t2Text').textContent = t2;
        setBadge('t2Badge', countWords(t2), 250);
    }
};

// === Export Both Answers ===
function exportAll() {
    const t1 = localStorage.getItem('task1Input') || '(No answer written)';
    const t2 = localStorage.getItem('task2Input') || '(No answer written)';
    const combined = `IELTS WRITING — REVIEWED ANSWERS
══════════════════════════════════

TASK 1
──────
${t1}

(Word count: ${countWords(t1)})

══════════════════════════════════

TASK 2
──────
${t2}

(Word count: ${countWords(t2)})
`;
    const blob = new Blob([combined], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Writing_Answers_Review_${new Date().toLocaleDateString().replace(/\//g,'-')}.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
}

// === Clear All & Restart ===
function restartTest() {
    if (!confirm('⚠️ This will CLEAR ALL answers and return to the start.\n\nThis cannot be undone. Continue?')) return;
    localStorage.removeItem('task1Input');
    localStorage.removeItem('task2Input');
    window.location.href = 'writing-intro.html';
}
</script>
</body>
</html>
